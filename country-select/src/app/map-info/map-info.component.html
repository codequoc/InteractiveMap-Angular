<div class="row">
    <div class="box">
        <div class="col-1">
            <p>Name: {{ countryName }}<br>
            Captial: {{ countryCap }}<br>
            Region: {{ countryReg }}<br>
            Income: {{ countryIncome }}<br>
            ISO: {{ countryISO }}<br>
            ID: {{ countryID }}
            </p>
        </div>
    </div>
    <div class="col-2">
        <app-map 
            (nameEvent)="showName($event)"
            (captialEvent)="showCapital($event)"
            (regionEvent)="showRegion($event)"
            (incomeEvent)="showIncome($event)"
            (isoEvent)="showISO($event)"
            (idEvent)="showID($event)"
        ></app-map>
    </div>
</div>
